<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Erreur 405</title>
    <style>
        body { background-color: #282a36; color: #f8f8f2; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .terminal { background-color: #44475a; padding: 30px 50px; border-radius: 10px; border-left: 6px solid #ff5555; width: 500px; box-shadow: 10px 10px 20px rgba(0,0,0,0.5); }
        h1 { color: #ff5555; margin-top: 0; }
        a { color: #8be9fd; text-decoration: none; font-weight: bold; }
        a:hover { color: #50fa7b; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>[X] 405 - Method Not Allowed</h1>
        <p>L'action demandée (POST, DELETE) est formellement interdite sur ce port.</p>
        <p style="color: #ff5555;">> Permission denied</p>
        <hr style="border: 1px solid #6272a4;">
        <p>> <a href="/">./retour_accueil.sh</a></p>
    </div>
</body>
</html>
