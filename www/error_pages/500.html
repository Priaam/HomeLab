<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Erreur 500</title>
    <style>
        body { background-color: #282a36; color: #f8f8f2; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .terminal { background-color: #ff5555; padding: 30px 50px; border-radius: 10px; width: 500px; box-shadow: 10px 10px 20px rgba(0,0,0,0.5); }
        h1 { color: #282a36; margin-top: 0; }
        p { color: #282a36; font-weight: bold; }
        a { color: #f8f8f2; text-decoration: underline; font-weight: bold; }
        a:hover { color: #282a36; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>[CRITICAL] 500 - Internal Server Error</h1>
        <p>Le serveur a rencontré une défaillance technique majeure.</p>
        <p>> Échec de l'accès au système de fichiers (C/C++ std::ofstream).</p>
        <hr style="border: 1px solid #282a36;">
        <p>> <a href="/">Redémarrer la session</a></p>
    </div>
</body>
</html>
